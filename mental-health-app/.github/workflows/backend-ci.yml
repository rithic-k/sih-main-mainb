name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import check (app boots without syntax errors)
        run: python -c "import app.main"
      # Add pytest once test suite exists:
      # - name: Run tests
      #   run: pytest
